name = "CCL"
grammar = "ccl"
path_suffixes = ["ccl", "prg"]
line_comments = ["; "]
block_comment = ["/*", "*/"]
tab_size = 2
hard_tabs = false
word_characters = ["$"]

brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "^", end = "^", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "~", end = "~", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "|", end = "|", close = true, newline = false, not_in = ["string", "comment"] },
]
